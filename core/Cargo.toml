[package]
name = "waydri-core"
version = "0.11.0"
edition = "2021"
authors = ["Waydri"]
description = "The core Wayland compositor for Waydri"
license = "Apache-2.0"
repository = "https://github.com/Waydri/Waydri"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
calloop = "0.13"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"