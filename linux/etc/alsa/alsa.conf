pcm.!default {
    type hw
    card 0
    device 0
}

ctl.!default {
    type hw
    card 0
}

defaults.pcm.card 0
defaults.pcm.device 0
defaults.pcm.subdevice -1
defaults.ctl.card 0

pcm.waydri {
    type plug
    slave.pcm "dmix:0,0"
    route_policy "duplicate"
}

ctl.waydri {
    type hw
    card 0
}
