[package]
name = "waydri"
version = "0.11.0"
edition = "2021"
license = "Apache-2.0"
description = "Wayland compositor for Android and Linux"
repository = "https://github.com/Waydri/Waydri"

[dependencies]
waydri-core = { path = "core" }

[workspace]
members = ["core"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[[bench]]
name = "compositor_events"
path = "benches/compositor/events.rs"
harness = false

[[bench]]
name = "compositor_handlers"
path = "benches/compositor/handlers.rs"
harness = false

[[bench]]
name = "compositor_state"
path = "benches/compositor/state.rs"
harness = false

[[bench]]
name = "input_gesture"
path = "benches/input/gesture.rs"
harness = false

[[bench]]
name = "input_keyboard"
path = "benches/input/keyboard.rs"
harness = false

[[bench]]
name = "input_pointer"
path = "benches/input/pointer.rs"
harness = false

[[bench]]
name = "input_touch"
path = "benches/input/touch.rs"
harness = false

[[bench]]
name = "memory_allocation"
path = "benches/memory/allocation.rs"
harness = false

[[bench]]
name = "memory_buffer"
path = "benches/memory/buffer.rs"
harness = false

[[bench]]
name = "memory_dmabuf"
path = "benches/memory/dmabuf.rs"
harness = false

[[bench]]
name = "renderer_gles"
path = "benches/renderer/gles.rs"
harness = false

[[bench]]
name = "renderer_shader"
path = "benches/renderer/shader.rs"
harness = false

[[bench]]
name = "renderer_texture"
path = "benches/renderer/texture.rs"
harness = false

[[bench]]
name = "renderer_vulkan"
path = "benches/renderer/vulkan.rs"
harness = false

[[bench]]
name = "startup_config"
path = "benches/startup/config.rs"
harness = false

[[bench]]
name = "startup_init"
path = "benches/startup/init.rs"
harness = false

[[bench]]
name = "startup_wayland"
path = "benches/startup/wayland.rs"
harness = false

[[bin]]
name = "tool_bench_compositor"
path = "tools/bench/compositor.rs"

[[bin]]
name = "tool_bench_input"
path = "tools/bench/input.rs"

[[bin]]
name = "tool_bench_memory"
path = "tools/bench/memory.rs"

[[bin]]
name = "tool_bench_renderer"
path = "tools/bench/renderer.rs"