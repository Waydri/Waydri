[package]
name = "waydri-core"
version = "0.11.0"
edition = "2021"
license = "Apache-2.0"
description = "Waydri compositor core – Rust/Wayland engine"
repository = "https://github.com/Waydri/Waydri"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
calloop = "0.13"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"

[target.'cfg(not(target_os="android"))'.dependencies]
smithay = { version = "0.3", features = ["backend_egl", "backend_gbm", "renderer_gl", "use_system_lib"] }
env_logger = "0.10"

[target.'cfg(target_os="android")'.dependencies]
smithay = { version = "0.3", features = ["backend_egl", "renderer_gl"] }
android_logger = "0.13"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "compositor_events"
path = "../benches/compositor/events.rs"
harness = false

[[bench]]
name = "compositor_handlers"
path = "../benches/compositor/handlers.rs"
harness = false

[[bench]]
name = "compositor_state"
path = "../benches/compositor/state.rs"
harness = false

[[bench]]
name = "input_gesture"
path = "../benches/input/gesture.rs"
harness = false

[[bench]]
name = "input_keyboard"
path = "../benches/input/keyboard.rs"
harness = false

[[bench]]
name = "input_pointer"
path = "../benches/input/pointer.rs"
harness = false

[[bench]]
name = "input_touch"
path = "../benches/input/touch.rs"
harness = false

[[bench]]
name = "memory_allocation"
path = "../benches/memory/allocation.rs"
harness = false

[[bench]]
name = "memory_buffer"
path = "../benches/memory/buffer.rs"
harness = false

[[bench]]
name = "memory_dmabuf"
path = "../benches/memory/dmabuf.rs"
harness = false

[[bench]]
name = "renderer_gles"
path = "../benches/renderer/gles.rs"
harness = false

[[bench]]
name = "renderer_shader"
path = "../benches/renderer/shader.rs"
harness = false

[[bench]]
name = "renderer_texture"
path = "../benches/renderer/texture.rs"
harness = false

[[bench]]
