name: debug

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust core (debug, only arm64)
        run: |
          cd core
          cargo ndk --target aarch64-linux-android --platform 24 build
          mkdir -p ../android/app/src/main/lib/aarch64-linux-android
          cp target/aarch64-linux-android/debug/libwaydri_core.so ../android/app/src/main/lib/aarch64-linux-android/

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waydri-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
