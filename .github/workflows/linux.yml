name: Linux
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libvulkan-dev
      - name: Build
        run: cargo build --release
      - name: Run tests
        if: matrix.rust == 'stable'
        run: cargo test --package waydri-core
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --package waydri-core -- -D warnings
      - name: Check formatting
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
  cross-compile:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross-compile for ARM64
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: waydri-linux-arm64
          path: target/aarch64-unknown-linux-gnu/release/waydri
