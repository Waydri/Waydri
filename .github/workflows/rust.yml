name: rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build Rust core (all ABIs)
        run: |
          cd core
          for abi in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android; do
            cargo ndk --target $abi --platform 24 build --release
            mkdir -p ../android/app/src/main/lib/${abi}
            cp target/$abi/release/libwaydri_core.so ../android/app/src/main/lib/${abi}/
          done
      - name: Upload .so artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust-libs
          path: android/app/src/main/lib/
